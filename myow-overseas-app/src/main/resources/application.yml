# Spring Boot Configuration
spring:
  application:
    name: myow-overseas-app
  profiles:
    active: dev
  messages:
    basename: i18n/messages
    encoding: UTF-8
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml

# Server Configuration
server:
  port: 8129
  servlet:
    context-path: /myow

# Sa-Token Configuration
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true

