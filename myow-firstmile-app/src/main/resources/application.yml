# Spring Boot Configuration
spring:
  application:
    name: myow-firstmile-app
  profiles:
    active: dev
  messages:
    basename: i18n/messages
    encoding: UTF-8
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yml
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

# Server Configuration
server:
  port: 8130
  servlet:
    context-path: /myow-firstmile

# Sa-Token Configuration
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true
